<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ページが見つかりません｜スキルアップ図鑑</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{--brand:#E67E22;--brand-dark:#B35C10;--ink:#2B2118;--ink-sub:#6B5D50;
  --bg:#FFFCF8;--card:#fff;--line:#EDE3D8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);line-height:1.8;min-height:100vh;
  display:flex;flex-direction:column;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif}
a{color:var(--brand-dark)}
header{background:var(--card);border-bottom:1px solid var(--line)}
.header-inner{max-width:760px;margin:0 auto;padding:12px 16px}
h1{margin:0;font-size:19px;font-weight:800}
h1 a{text-decoration:none;color:inherit}
h1 .mark{color:var(--brand)}
main{flex:1;max-width:760px;margin:0 auto;padding:64px 16px;text-align:center}
main h2{font-size:24px;margin:0 0 12px}
main p{color:var(--ink-sub);margin:0 0 28px}
.home{display:inline-block;background:var(--brand);color:#fff;text-decoration:none;font-weight:700;
  padding:13px 32px;border-radius:999px}
.home:hover{background:var(--brand-dark)}
</style>
<!-- Google AdSense。サイト所有権の確認（審査）には、このタグが <head> に
     静的に書かれている必要がある。JSから動的に読み込む形にすると、
     AdSense のクローラーが見つけられず「サイトを確認できませんでした」になる。 -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5761092657360295" crossorigin="anonymous"></script>
</head>
<body>
<header><div class="header-inner">
  <h1><a href="/">スキルアップ<span class="mark">図鑑</span></a></h1>
</div></header>
<main>
  <h2>ページが見つかりません</h2>
  <p>お探しのページは削除されたか、URLが変更された可能性があります。<br>掲載を取り下げた講座のページも、こちらに表示されます。</p>
  <a class="home" href="/">講座一覧を見る</a>
</main>
</body>
</html>
