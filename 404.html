<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ページが見つかりません｜スキルアップ図鑑</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{--brand:#E67E22;--brand-dark:#B35C10;--ink:#2B2118;--ink-sub:#6B5D50;
  --bg:#FFFCF8;--card:#fff;--line:#EDE3D8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);line-height:1.8;min-height:100vh;
  display:flex;flex-direction:column;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif}
a{color:var(--brand-dark)}
header{background:var(--card);border-bottom:1px solid var(--line)}
.header-inner{max-width:760px;margin:0 auto;padding:12px 16px}
.site-name{margin:0;font-size:19px;font-weight:800}
.site-name a{text-decoration:none;color:inherit}
.site-name .mark{color:var(--brand)}
main{flex:1;max-width:760px;margin:0 auto;padding:64px 16px;text-align:center}
main h1{font-size:24px;margin:0 0 12px}
main p{color:var(--ink-sub);margin:0 0 28px}
.home{display:inline-block;background:var(--brand);color:#fff;text-decoration:none;font-weight:700;
  padding:13px 32px;border-radius:999px}
.home:hover{background:var(--brand-dark)}
</style>
<!-- Google AdSense。サイト所有権の確認（審査）には、このタグが <head> に
     静的に書かれている必要がある。JSから動的に読み込む形にすると、
     AdSense のクローラーが見つけられず「サイトを確認できませんでした」になる。 -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5761092657360295" crossorigin="anonymous"></script>
<!-- 運営者自身のアクセスを計測しないためのスイッチ。
     ?ga=off を一度開くと、そのブラウザでは以後計測しない（?ga=on で解除、?ga=status で確認）。
     設定はブラウザごとに保存されるので、パソコンとスマホでそれぞれ1回開く必要がある。
     gtag の設定より前に置くこと。最初のページビューが送られる前に効かせるため。 -->
<script>
(function () {
  var MEASUREMENT_ID = 'G-7EE8WZT75D';
  var KEY = 'analytics-opt-out';
  var mode = null;
  try {
    mode = new URLSearchParams(location.search).get('ga');
    if (mode === 'off') localStorage.setItem(KEY, '1');
    if (mode === 'on') localStorage.removeItem(KEY);
    if (localStorage.getItem(KEY) === '1') window['ga-disable-' + MEASUREMENT_ID] = true;
  } catch (e) {
    // プライベートモード等で localStorage が使えなくても、サイト本体は動かす。
  }
  if (mode !== 'off' && mode !== 'on' && mode !== 'status') return;

  // 効いているかどうかを画面で分かるようにする（操作した本人にだけ出る）。
  var off = false;
  try { off = localStorage.getItem(KEY) === '1'; } catch (e) { off = false; }
  var text = off
    ? 'このブラウザからのアクセスは計測しません（解除するには ?ga=on）'
    : 'このブラウザからのアクセスを計測します（除外するには ?ga=off）';
  document.addEventListener('DOMContentLoaded', function () {
    var el = document.createElement('div');
    el.textContent = text;
    el.style.cssText = 'position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:9999;' +
      'background:#2B2118;color:#fff;font-size:13px;line-height:1.6;padding:12px 18px;border-radius:8px;' +
      'box-shadow:0 4px 16px rgba(0,0,0,.25);max-width:calc(100vw - 32px);text-align:center';
    document.body.appendChild(el);
    setTimeout(function () { el.remove(); }, 8000);
  });
})();
</script>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-7EE8WZT75D"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-7EE8WZT75D');
</script>
</head>
<body>
<header><div class="header-inner">
  <p class="site-name"><a href="/">スキルアップ<span class="mark">図鑑</span></a></p>
</div></header>
<main>
  <h1>ページが見つかりません</h1>
  <p>お探しのページは削除されたか、URLが変更された可能性があります。<br>掲載を取り下げた講座のページも、こちらに表示されます。</p>
  <a class="home" href="/">講座一覧を見る</a>
</main>
</body>
</html>
