name: Discover new schools (daily)

# freelance-anken-zukan の discover-agents.yml を踏襲。
# 全8ジャンルの初回レビューが完了したため、日次実行の対象を all に広げた。
# discover-schools.js 側でジャンルの並び順を日付で回転させ、上限件数で打ち切られても
# どのジャンルにも定期的に順番が回るようにしている。

on:
  schedule:
    # 毎日 20:00 UTC(前日) = 日本時間(JST) 5:00 に実行
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      genres:
        description: "対象ジャンル（カンマ区切り、または all）。空欄なら all（全8ジャンル）"
        required: false
        type: string
        default: "all"
      max_candidates:
        description: "1回の実行で新規発見を試みる候補数の上限。空欄なら20件（日次自動実行は常に10件）"
        required: false
        type: string
        default: "20"

# run ブロックの既定シェルを bash に固定する。
# 指定しない場合の既定は "bash -e {0}" で pipefail が無効なため、
#   node script.js | tail -5
# のようにパイプを書くと、左側が失敗しても終了コードが tail のもの(0)になり、
# 失敗が握りつぶされてワークフローがグリーンのまま進んでしまう。
# "shell: bash" は "bash --noprofile --norc -eo pipefail {0}" になり、pipefail が有効になる。
defaults:
  run:
    shell: bash

permissions:
  contents: write

concurrency:
  # data/schools.json / data/school-discover-skip.json をコミット・pushする。
  group: repo-content-write
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: scraper/package-lock.json

      - name: Install scraper dependencies
        working-directory: scraper
        run: npm ci

      - name: Run unit tests
        working-directory: scraper
        run: npm test

      - name: Discover, verify and list new schools via Claude (web_search)
        working-directory: scraper
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # 日次cron実行時は全8ジャンルを対象にする。件数の上限は20件。
          DISCOVER_GENRES: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.genres || 'all' }}
          DISCOVER_MAX_PER_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.max_candidates || '20' }}
        run: node discover-schools.js

      - name: Install Chrome for prerendering
        run: npx --yes puppeteer browsers install chrome

      - name: Prerender school and category pages
        working-directory: scraper
        run: node prerender.js

      - name: Regenerate sitemap.xml and llms.txt
        working-directory: scraper
        run: node generate-sitemap.js

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/schools.json sitemap.xml llms.txt
          [ -d school ] && git add school
          [ -d category ] && git add category
          [ -f data/school-discover-skip.json ] && git add data/school-discover-skip.json
          [ -d data/discovery-log ] && git add data/discovery-log
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: discover new schools ($(date -u +%Y-%m-%d))"

          max_retries=2
          attempt=0
          until git push; do
            attempt=$((attempt + 1))
            if [ "$attempt" -gt "$max_retries" ]; then
              echo "::error::push failed after $max_retries retries"
              exit 1
            fi
            echo "push failed (attempt $attempt/$max_retries) — pulling --rebase and retrying..."
            git pull --rebase origin main
          done
