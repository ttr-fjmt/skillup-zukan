name: Discover new schools (daily)

# freelance-anken-zukan の discover-agents.yml を踏襲。
# 既存2サイトの教訓に従い、日次実行は DISCOVER_GENRES を1ジャンルに絞る。
# ジャンルを増やすのは、そのジャンルの結果を人力レビューして精度を確認してから。

on:
  schedule:
    # 毎日 20:00 UTC(前日) = 日本時間(JST) 5:00 に実行
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      genres:
        description: "対象ジャンル（カンマ区切り、または all）。空欄なら programming のみ"
        required: false
        type: string
        default: "programming"
      max_candidates:
        description: "1回の実行で新規発見を試みる候補数の上限。空欄なら20件（日次自動実行は常に10件）"
        required: false
        type: string
        default: "20"

permissions:
  contents: write

concurrency:
  # data/schools.json / data/school-discover-skip.json をコミット・pushする。
  group: repo-content-write
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: scraper/package-lock.json

      - name: Install scraper dependencies
        working-directory: scraper
        run: npm ci

      - name: Run unit tests
        working-directory: scraper
        run: npm test

      - name: Discover, verify and list new schools via Claude (web_search)
        working-directory: scraper
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # 日次cron実行時はコスト・品質管理のため常に programming の10件のまま。
          DISCOVER_GENRES: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.genres || 'programming' }}
          DISCOVER_MAX_PER_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.max_candidates || '10' }}
        run: node discover-schools.js

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/schools.json
          [ -f data/school-discover-skip.json ] && git add data/school-discover-skip.json
          [ -d data/discovery-log ] && git add data/discovery-log
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: discover new schools ($(date -u +%Y-%m-%d))"

          max_retries=2
          attempt=0
          until git push; do
            attempt=$((attempt + 1))
            if [ "$attempt" -gt "$max_retries" ]; then
              echo "::error::push failed after $max_retries retries"
              exit 1
            fi
            echo "push failed (attempt $attempt/$max_retries) — pulling --rebase and retrying..."
            git pull --rebase origin main
          done
